  <style>
    .static-splash { position: fixed; inset: 0; background: #000; z-index: 99999; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 28px; }
    .static-splash.fade-out { opacity: 0; visibility: hidden; transition: opacity 0.65s cubic-bezier(0.22,1,0.36,1), visibility 0.5s; }
    .splash-content { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .premium-spinner {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 3.5px solid rgba(255, 255, 255, 0.08);
      border-top-color: rgba(255, 255, 255, 0.95);
      animation: spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.25));
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
