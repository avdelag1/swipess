# Codemagic CI/CD — builds the Swipess iOS app on a cloud Mac (modern Xcode),
# signs it with your Apple Developer account, and uploads it to TestFlight /
# App Store Connect. This is what lets you ship even though your local Mac
# is capped at Xcode 14.2 (which Apple rejects at upload).
#
# ONE-TIME SETUP IN THE CODEMAGIC UI (see chat for the click-by-click):
#   1. Connect this GitHub repo.
#   2. Team settings -> Integrations -> App Store Connect: add your API key
#      and name the integration EXACTLY:  AppStoreConnect
#   3. In App Store Connect, register bundle id  com.swipess.mobile  and
#      create the app record before the first signed build.
#   4. Team settings -> Environment variables -> group "swipess_env":
#        VITE_MAPBOX_ACCESS_TOKEN  (required — map bakes token at vite build)
#        VITE_SUPABASE_URL         (optional)
#        VITE_SUPABASE_PUBLISHABLE_KEY (optional)

workflows:
  ios-testflight:
    name: iOS – Build & TestFlight
    max_build_duration: 60
    integrations:
      app_store_connect: AppStoreConnect   # must match the integration name set in Codemagic
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      groups:
        - swipess_env
      ios_signing:
        provisioning_profiles:
          - profile
        certificates:
          - CERT
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.swipess.mobile"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install JS dependencies
        script: npm ci || npm install
      - name: Log build source (verify correct commit + version)
        script: |
          echo "Branch: ${CM_BRANCH:-unknown}"
          echo "Commit: $(git rev-parse --short HEAD) — $(git log -1 --pretty=%s)"
          echo "App version (package.json): $(node -p "require('./package.json').version")"
      - name: Verify Mapbox token for iOS web build
        script: |
          if [ -z "$VITE_MAPBOX_ACCESS_TOKEN" ]; then
            echo "ERROR: VITE_MAPBOX_ACCESS_TOKEN is missing."
            echo "Add it to Codemagic env group 'swipess_env' (Team settings -> Environment variables)."
            exit 1
          fi
          echo "Mapbox token present (${#VITE_MAPBOX_ACCESS_TOKEN} chars)"
      - name: Build web + sync Capacitor iOS (+ Info.plist patch + version sync)
        script: npm run ios:sync
      - name: Confirm Xcode marketing version
        script: |
          grep MARKETING_VERSION ios/App/App.xcodeproj/project.pbxproj | head -2
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install --repo-update
      - name: Set a unique build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          # Codemagic's monotonic counter keeps every upload unique. Non-fatal if agvtool hiccups.
          agvtool new-version -all "$BUILD_NUMBER" || true
      - name: Install provisioning profiles into the keychain
        script: xcode-project use-profiles
      - name: Build signed .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true          # lands in TestFlight; submit to App Store review later
      email:
        recipients:
          - onefithealth@gmail.com
        notify:
          success: true
          failure: true
